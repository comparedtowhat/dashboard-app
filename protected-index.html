<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('ld_settings') || '{}');
      const theme = s.theme || 'system';
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const apply = (t) => document.documentElement.classList.add(t);
      if (theme === 'light') apply('theme-light');
      else if (theme === 'dark') apply('theme-dark');
      else if (theme === 'system') {
        apply(prefersDark ? 'theme-dark' : 'theme-light');
      }
    } catch (e) { /* ignore */ }
  </script>
  <title>Link Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My fabulous Links</h1>
    <div id="headerDateTime" class="header-datetime" aria-label="Aktuelles Datum und Uhrzeit"></div>
  </header>
  <div class="header-rule" aria-hidden="true"></div>

  <nav class="panels">
    <div id="panelTabs" class="panel-tabs"></div>
    <button id="addPanelBtn" class="add-panel-btn">+</button>
    <button id="deletePanelBtn" class="add-panel-btn">-</button>
  </nav>

  <main>
    <div id="categories" class="grid"></div>
  </main>

  <aside id="notesPanel" class="notes-panel" aria-label="Notizen">
    <div class="notes-head">
      <h2>Notes</h2>
      <button id="clearNotesBtn" class="notes-clear-btn" title="Notizen leeren" aria-label="Notizen leeren">✕</button>
    </div>
    <textarea id="notesInput" placeholder="Girls just wanna have fun..." spellcheck="false"></textarea>
  </aside>

  <template id="category-template">
    <section class="card">
      <div class="card-header" draggable="true">
        <span class="drag-handle" title="Ziehen">☰</span>
        <h2 class="cat-name"></h2>
        <div class="cat-actions">
          <button class="rename-cat" title="Umbenennen">✎</button>
          <button class="del-cat">Löschen</button>
        </div>
      </div>
      <ul class="links-list"></ul>
    </section>
  </template>

  <template id="link-template">
    <li class="link-item">
      <span class="link-left" draggable="true"><span class="link-drag">⋮⋮</span></span>
      <div class="link-main">
        <a class="link-anchor" target="_blank" rel="noopener noreferrer"></a>
        <div class="link-desc"></div>
      </div>
      <div class="link-actions">
        <button class="edit-link">✎</button>
        <button class="del-link">✕</button>
      </div>
    </li>
  </template>

  <script src="app.js" type="module"></script>

  <aside id="settingsPanel" class="settings-panel" aria-hidden="true">
    <div class="settings-card">
      <div class="settings-header">
        <strong>Einstellungen</strong>
        <button id="closeSettings" class="close-btn">✕</button>
      </div>
      <div class="settings-body">
        <label>Theme</label>
        <div class="theme-toggle" role="tablist" aria-label="Theme">
          <button class="toggle-btn" data-theme="system" aria-label="Auto">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 20v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.93 4.93l1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.66 17.66l1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.93 19.07l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Auto</span>
          </button>
          <button class="toggle-btn" data-theme="light" aria-label="Light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 20v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.93 4.93l1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.66 17.66l1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Light</span>
          </button>
          <button class="toggle-btn" data-theme="dark" aria-label="Dark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Dark</span>
          </button>
        </div>
      </div>
      <div class="settings-footer">
        <button id="resetSettings" class="muted">Zurücksetzen</button>
      </div>
    </div>
  </aside>

  <div id="linkModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <form id="linkForm">
        <h3 id="linkFormTitle">Link</h3>
        <label>Name<br><input id="linkName" type="text" required></label>
        <label>URL<br><input id="linkUrl" type="url" required></label>
        <label>Beschreibung (optional)<br><textarea id="linkDescription" rows="2"></textarea></label>
        <label>Kategorie<br><select id="linkCategory"></select></label>
        <div class="modal-actions">
          <button type="button" id="linkCancel">Abbrechen</button>
          <button type="submit" id="linkSave">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <div id="omSymbol" class="om-symbol" aria-hidden="true">
    <img id="omImage" src="/assets/om.png" alt="Om" style="display:none" />
    <svg id="omSvg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
      <title>Om symbol (styled)</title>
      <path d="M38 18c-3.5-1.8-7.8-1.3-10.8 1.1-3 2.4-3.6 6.6-1.2 9.6 2.4 3 6.2 3.6 9.3 1.4 3.1-2.2 3.6-6.6 1.7-9.1-.9-1.2-2.1-1.7-2.9-1z" fill="currentColor"/>
      <path d="M30 30c-1.6 0-3.3 1.6-3.3 3.2 0 4.9-5.1 8.9-9.9 10.5-2.6.8-3.8 3.6-3 6 0.9 2.7 3.8 3.8 6.2 3 6-2.3 14-7.5 16.2-16 1-3.4-1.6-6.4-5.2-6.7z" fill="currentColor"/>
      <path d="M45.5 12.5c-.9-.9-2.5-.6-3.4.4-1 1-1 2.6-.2 3.6.8 1 2.5 1 3.4-.1.8-1 1-2.6.2-3.9z" fill="currentColor"/>
      <circle cx="48.5" cy="9.5" r="2.4" fill="currentColor"/>
    </svg>
  </div>
  <div id="omBottomRule" class="om-bottom-rule" aria-hidden="true"></div>
  <div class="bottom-actions" aria-label="Schnellaktionen">
    <button id="addCategoryBtn">+ Kategorie</button>
    <button id="addLinkBtn">+ Link</button>
  </div>
  <button id="settingsBtn" class="settings-tab-btn" title="Einstellungen" aria-label="Einstellungen">Settings</button>
</body>
</html>
